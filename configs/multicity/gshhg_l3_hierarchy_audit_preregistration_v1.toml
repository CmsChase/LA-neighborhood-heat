l3_meaning = "islands in lakes"
selection_rule = "select every full-resolution L3 Polygon row whose direct parent_id is exactly one of 180507, 180515, or 180517"
selected_l2_source_ids = [180507, 180515, 180517]
include_every_direct_l3_descendant = true
selected_l3_exteriors_only = true
selected_l3_interior_rings_excluded = true
sibling_id_is_audit_only_not_selection = true
selection_may_use_city = false
selection_may_use_bbox = false
selection_may_use_name = false
hierarchy_inclusion_selection_may_use_area = false
selection_may_use_distance = false
selection_may_use_eligible_support = false
selection_may_use_target_or_qa = false
selection_may_use_model_prediction_or_result = false
l4_level = 4
l4_meaning = "ponds in islands within lakes"
l4_members_may_be_opened = false
l4_geometry_included = false
l4_exclusion_reason = "L4 boundaries are pond shores inside L3 islands and are excluded from the selected Great-Lakes-water shoreline contract. Any L3 interior rings, if observed, are excluded by the exterior-only rule; their semantics are not assumed by this preregistration."

[structural_audit]
expected_crs = "EPSG:4326"
expected_attribute_columns = [
  "id",
  "level",
  "source",
  "parent_id",
  "sibling_id",
  "area",
]
expected_geometry_column = "geometry"
expected_geometry_types = ["Polygon"]
allowed_source_values = ["WDBII", "WVS"]
require_exact_member_presence_and_case = true
require_member_bytes_sha256_and_crc_record = true
require_member_schema_dtype_crs_and_bounds_record = true
require_full_layer_row_count_and_semantic_sha256 = true
require_selected_direct_descendant_subset_semantic_sha256 = true
require_selected_exterior_linework_semantic_sha256 = true
require_selected_counts_by_parent = true
require_selected_interior_ring_count_record = true
require_all_rows_level_3 = true
require_unique_nonempty_canonical_source_ids = true
canonical_source_id_pattern = "^(0|[1-9][0-9]*)(?:-[EW])?$"
require_finite_positive_reported_area = true
require_nonempty_valid_polygon_geometry = true
geometry_repair_allowed = false
geometry_decomposition_allowed = false
require_at_least_one_selected_direct_descendant = true
require_selected_child_strictly_within_declared_l2_parent = true
require_selected_child_boundary_disjoint_from_parent_exterior = true
require_selected_sibling_interiors_not_overlapping = true
require_selected_exterior_longitude_jumps_below_180_degrees = true
longitude_jump_threshold_degrees = 180.0
semantic_row_order = "ascending base numeric id, then suffix order none, E, W"
semantic_row_fields = "canonical source id including any official -E or -W dateline suffix, integer level, exact source, integer parent_id, integer sibling_id, float64 area, normalized geometry WKB SHA-256"
unexpected_structure_fails_before_probe_or_distance = true

[structural_audit.expected_dtypes]
id = "str"
level = "int32"
source = "str"
parent_id = "int32"
sibling_id = "int32"
area = "float64"
geometry = "geometry"

[probe_rule]
scope = "one deterministic real L3 component for every selected L2 parent that has at least one direct child"
child_selection_order = "source-reported area descending, then canonical child source id by base numeric id and suffix order none, E, W"
probe_ranking_may_use_source_reported_area = true
child_selection_may_use_distance = false
child_selection_may_use_city_target_or_result = false
probe_geometry_operation = "normalize selected Polygon, then shapely representative_point"
probe_must_be_strictly_contained_and_not_on_boundary = true
probe_crs_rule = "northern WGS84 UTM; zone=floor((longitude+180)/6)+1; EPSG=32600+zone"
southern_or_out_of_utm_domain_probe_allowed = false
minimum_real_probe_count = 1
require_candidate_nearest_provenance_is_probe_child_id = true
require_unique_nearest_within_tie_tolerance = true
nearest_tie_absolute_tolerance_m = 0.000001
require_candidate_distance_matches_direct_own_exterior = true
require_l1_l2_only_distance_strictly_greater_than_l3_inclusive = true
require_finite_positive_probe_distances = true
distance_equality_absolute_tolerance_m = 0.000001
strict_improvement_minimum_m = 0.000001
probe_reselection_after_distance_allowed = false
required_probe_evidence_fields = [
  "child_source_id",
  "parent_id",
  "source_reported_area",
  "normalized_child_wkb_sha256",
  "representative_point_longitude",
  "representative_point_latitude",
  "representative_point_sha256",
  "derived_projected_crs",
  "nearest_source_level",
  "nearest_source_id",
  "nearest_longitude",
  "nearest_latitude",
  "nearest_tie_count",
  "shapely_geos_runtime",
  "pyproj_runtime",
]

[numerical_audit]
floating_dtype = "float64"
projected_distance_method = "exact Euclidean point-to-line distance in the predeclared metre-based CRS"
search_radii_km = [64, 128, 256, 512, 1024, 2048]
radius_acceptance_rule = "accept only when every diagnostic distance is finite and strictly less than the active radius; every larger accepted radius must reproduce the first accepted value"
line_chunk_vertex_counts = [256, 1024, 4096]
canonical_line_chunk_vertex_count = 1024
query_chunk_sizes = [1, 2, 4]
worker_counts = [1, 2, 4]
require_strtree_bruteforce_parity = true
require_source_forward_reverse_invariance = true
require_line_chunk_invariance = true
require_true_vector_query_chunk_invariance = true
require_worker_count_invariance = true
invariance_absolute_tolerance_m = 0.000001
geodesic_reference_method = "pyproj.Geod WGS84 densification followed by point-to-vertex geodesic minimum"
geodesic_densification_max_step_m = 50.0
geodesic_absolute_tolerance_m = 100.0
geodesic_relative_tolerance = 0.005
require_projected_geodesic_gate = true
projected_geodesic_gate_applies_to = "all four existing fixed points and every real L3 probe"
projected_geodesic_pass_rule = "absolute(projected distance minus geodesic distance) must be less than or equal to max(100 m, 0.005 times geodesic distance)"
replay_existing_four_gshhg_points_without_census = true
existing_four_point_absolute_tolerance_m = 0.000001
candidate_l3_distances_must_equal_v2_at_existing_four_points = true
census_layer_may_be_opened = false
census_distances_may_be_recomputed = false

