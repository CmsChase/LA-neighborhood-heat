[geometry_contract]
ocean_layer = "GSHHS_shp/f/GSHHS_f_L1.shp"
lake_layer = "GSHHS_shp/f/GSHHS_f_L2.shp"
expected_crs = "EPSG:4326"
expected_attribute_columns = [
  "id",
  "level",
  "source",
  "parent_id",
  "sibling_id",
  "area",
]
ocean_level = 1
lake_level = 2
ocean_rule = "polygon exteriors only; polygon interior rings are not ocean shoreline"
great_lakes_rule = "five predeclared interior seeds must select five distinct positive-area L2 polygons"
great_lakes_shore_rule = "selected L2 polygon exteriors only; L3 island shores are excluded from this four-city pilot"
river_lake_rule = "exclude every L2 polygon with negative area before seed matching"
dateline_rule = "remove only consecutive exterior segments whose two endpoints both lie on the same plus-or-minus 180 degree meridian"
dateline_tolerance_degrees = 0.000000001
reject_remaining_segment_longitude_jump_degrees = 180.0
antarctica_rule = "L1 excludes Antarctica; L5 and L6 are outside this four-U.S.-city pilot"

[distance_audit]
search_radii_km = [64, 128, 256, 512, 1024, 2048]
line_chunk_vertex_counts = [256, 1024, 4096]
canonical_line_chunk_vertex_count = 1024
query_chunk_sizes = [1, 2, 4]
worker_counts = [1, 2, 4]
floating_dtype = "float64"
projected_distance_method = "exact Euclidean point-to-line distance in each predeclared metre-based city UTM CRS"
native_prefilter_rule = "conservative longitude-latitude envelope before projection; never project the global layer at once"
radius_acceptance_rule = "accept only when every diagnostic distance is finite and strictly less than the active radius"
strtree_bruteforce_absolute_tolerance_m = 0.000001
invariance_absolute_tolerance_m = 0.000001
geodesic_reference_method = "pyproj.Geod WGS84 densification followed by point-to-vertex geodesic minimum"
geodesic_densification_max_step_m = 50.0
geodesic_absolute_tolerance_m = 100.0
geodesic_relative_tolerance = 0.005

[comparison]
census_config = "configs/multicity/water_distance_review_v1.toml"
census_layer = "tl_2019_us_coastline.shp"
census_filter_field = "MTFCC"
census_filter_value = "L4150"
census_name_field_role = "audit-only; never used to include or exclude geometry"
signed_difference_definition = "GSHHG diagnostic distance minus Census diagnostic distance"
phoenix_must_be_reported_separately = true
source_decision_allowed = false
algorithm_decision_allowed = false
predictor_construction_allowed = false

