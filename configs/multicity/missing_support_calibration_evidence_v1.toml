[stage]
schema_version = 1
algorithm_version = "multicity-missing-support-calibration-evidence-v1"
stage_id = "target_blind_missing_support_and_calibration_evidence_v1"
experiment_id = "la_to_three_city_zero_shot_v1"
experiment_config = "configs/multicity/experiment.toml"
plan_path = "manifests/multicity/PLAN_READINESS.json"
predecessor_terminal = "manifests/multicity/reviews/portable_predictor_contract/PORTABLE_PREDICTOR_CONTRACT_FREEZE_V2.json"
contract_config = "configs/multicity/portable_predictor_contract_freeze_v2.toml"
city_ids = ["los_angeles_ca", "phoenix_az", "houston_tx", "chicago_il"]
external_city_ids = ["phoenix_az", "houston_tx", "chicago_il"]
source_city_id = "los_angeles_ca"
analysis_crs = "EPSG:5070"
confirmation_year = 2025
target_blind = true
predictor_construction_authorized = false
model_fit_authorized = false
external_target_access_authorized = false

[geography]
algorithm_version = "four-city-census-geography-contract-v1"
provider = "U.S. Census Bureau"
vintage = 2020
place_layer = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Census2020/MapServer/26"
tract_layer = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Census2020/MapServer/6"
route = "TIGERweb_Census2020_only"
fallback_allowed = false
analysis_crs = "EPSG:5070"
minimum_original_tract_area_inside_place_fraction = 0.50
exclude_special_use_tract_prefix = "98"
repair_order = "make_each_geometry_valid_before_place_dissolve_or_tract_intersection"
candidate_query = "bbox_only_then_exact_positive_polygon_intersection"
primary_geometry = "clipped_intersection_with_incorporated_place"
geoid_sort = "ascending_ascii"
output_crs = "EPSG:5070"
los_angeles_action = "same_adapter_rebuild_plus_phase1_compatibility_audit"
phoenix_action = "same_adapter_rebuild_plus_source_footprint_compatibility_audit"
houston_action = "replay_saved_tigerweb_raw_responses_and_require_existing_manifest_identity"
chicago_action = "replay_saved_tigerweb_raw_responses_and_require_existing_manifest_identity"
geography_evidence_may_record_nonparity = true
nonparity_requires_v3_decision = true

[geography.legacy_bindings]
los_angeles_boundary = "data/interim/pilot/la_city_boundary.geojson"
los_angeles_tract_universe = "data/interim/pilot/tract_universe_manifest.parquet"
phoenix_manifest = "manifests/multicity/cities/phoenix_az/geography/GEOGRAPHY.json"
phoenix_source_footprint_manifest = "manifests/multicity/cities/phoenix_az/source_footprints/SOURCE_FOOTPRINTS.json"
houston_manifest = "manifests/multicity/cities/houston_tx/geography/GEOGRAPHY.json"
chicago_manifest = "manifests/multicity/cities/chicago_il/geography/GEOGRAPHY.json"

[geography.compatibility]
compare_exact_geoid_set = true
compare_threshold_and_special_use_classification = true
compare_original_and_clipped_area = true
compare_normalized_geometry_by_geoid = true
compare_30m_zone_cell_assignment = true
grid_resolution_m = 30.0
grid_edge_anchor_x_m = 15.0
grid_edge_anchor_y_m = 15.0
rasterization_all_touched = false
parity_is_observed_evidence_not_assumed_success = true
phoenix_replay_sources = ["landsat_wrs", "sentinel_mgrs", "daymet_cells", "terrain_windows"]

[geography.limits]
maximum_requests = 64
maximum_single_response_bytes = 67108864
maximum_total_response_bytes = 268435456
redirects_allowed = false
allowed_hosts = ["tigerweb.geo.census.gov"]
allowed_path_prefixes = ["/arcgis/rest/services/TIGERweb/tigerWMS_Census2020/MapServer/6", "/arcgis/rest/services/TIGERweb/tigerWMS_Census2020/MapServer/26"]

[worldcover]
algorithm_version = "four-city-worldcover-eligible-support-v1"
provider = "European Space Agency via Microsoft Planetary Computer"
stac_api = "https://planetarycomputer.microsoft.com/api/stac/v1"
stac_collection = "esa-worldcover"
year = 2020
version = "v100"
asset = "map"
source_nodata_class = 0
excluded_water_classes = [80]
item_selection = "all_v100_map_assets_with_positive_raster_footprint_intersection_to_frozen_city_grid"
unsigned_asset_urls_persisted_only = true
complete_asset_download_and_sha256_required = true
native_mosaic_order = "item_id_ascending_first_on_shared_native_grid"
reverse_order_parity_required = true
target_resolution_m = 30.0
target_grid_edge_anchor_x_m = 15.0
target_grid_edge_anchor_y_m = 15.0
categorical_resampling = "mode"
single_threaded_warp = true
target_rasterization_all_touched = false
eligible_definition = "tract_zone_and_worldcover_valid_and_not_class_80"
same_support_required_for_static_daymet_sentinel_and_landsat_target = true
every_primary_tract_requires_positive_zone_and_eligible_count = true

[worldcover.hash_contract]
zone_dtype = "little_endian_int32_C_order"
class_dtype = "uint8_C_order"
eligible_mask_encoding = "numpy_packbits_bitorder_big_C_order"
flat_cell_index = "zero_based_top_left_row_major_sorted_little_endian_uint64"
bind_shape_and_cell_count = true
bind_city_geography_semantic_sha256 = true
bind_grid_sha256 = true
bind_zone_sha256 = true
bind_class_sha256 = true
bind_eligible_mask_sha256 = true
per_tract_identity_prefix_fields = ["algorithm_version", "city_id", "tract_geoid", "grid_sha256", "zone_sha256", "eligible_mask_sha256"]

[worldcover.limits]
maximum_unique_assets = 8
maximum_requests = 64
maximum_single_asset_bytes = 2147483648
maximum_total_asset_bytes = 12884901888
redirects_allowed = false
require_content_length = true
allowed_hosts = ["planetarycomputer.microsoft.com", "esa-worldcover.s3.eu-central-1.amazonaws.com", "ai4edataeuwest.blob.core.windows.net"]
allowed_stac_path = "/api/stac/v1/search"
allowed_sas_path_prefix = "/api/sas/v1/token/"
allowed_asset_path_prefix_by_host = { "esa-worldcover.s3.eu-central-1.amazonaws.com" = "/v100/2020/map/", "ai4edataeuwest.blob.core.windows.net" = "/esa-worldcover/v100/2020/map/" }
asset_cache = "data/raw/multicity/worldcover_2020_v100/assets_by_sha256"
working_directory = "data/interim/multicity/missing_support_calibration_evidence_v1/worldcover"

[sentinel]
algorithm_version = "external-city-sentinel-calibration-smoke-v1"
provider = "ESA Copernicus via Microsoft Planetary Computer"
stac_api = "https://planetarycomputer.microsoft.com/api/stac/v1"
stac_collection = "sentinel-2-l2a"
prohibited_collection = "Element84_EarthSearch_sentinel-2-l2a_legacy_harmonized_COG"
required_assets = ["B02", "B03", "B04", "B08", "B8A", "B11", "B12", "SCL", "product-metadata"]
required_reflectance_assets = ["B02", "B03", "B04", "B08", "B8A", "B11", "B12"]
ten_metre_assets = ["B02", "B03", "B04", "B08"]
twenty_metre_assets = ["B8A", "B11", "B12", "SCL"]
source_metadata_table_name = "sentinel_metadata_items.parquet"
local_timezone_source = "per_city_frozen_IANA_timezone"
physical_acquisition_key = "platform_acquired_utc_relative_orbit_normalized_datatake_id"
reprocessing_selection_order = "coverage_desc_processing_baseline_desc_generation_time_desc_item_id_asc"
probe_group = "each_native_utm_zone_with_positive_worldcover_eligible_cell_overlap"
candidate_order = "eligible_cell_overlap_desc_acquired_utc_asc_mgrs_tile_asc_item_id_asc"
candidate_fallback_based_on_values_allowed = false
probe_cell_order = "eligible_cell_flat_index_ascending_within_selected_item_after_fixed_full_window_margin"
probe_cell_full_window_margin_m = 400.0
native_window_shape = [32, 32]
window_clipping_allowed = false
validate_mgrs_utm_zone_and_hemisphere = true
require_north_up_square_pixels = true
native_grid_edge_anchor_x_m = 0.0
native_grid_edge_anchor_y_m = 0.0
boa_formula = "reflectance=(DN+BOA_ADD_OFFSET)/BOA_QUANTIFICATION_VALUE"
boa_offset_applied_exactly_once = true
require_all_seven_band_offsets_for_processing_baseline_04_or_later = true
nodata_dn = 0
saturated_dn = 65535
compute_indices_or_tract_features = false
record_scl_histogram_for_audit_only = true
require_scl_4_or_5_for_probe = false
signed_asset_urls_persisted = false
allowed_http_content_encodings = ["identity", "gzip", "deflate", "br", "zstd"]
http_entity_body_accounting = "maximum_of_declared_encoded_and_decoded_bytes"

[sentinel.limits]
expected_minimum_probe_groups = 4
maximum_probe_groups = 8
maximum_requests = 1024
maximum_product_metadata_bytes = 16777216
maximum_range_response_bytes = 67108864
maximum_total_download_bytes = 1073741824
redirects_allowed = false
allowed_hosts = ["planetarycomputer.microsoft.com", "sentinel2l2a01.blob.core.windows.net"]
allowed_stac_path = "/api/stac/v1/search"
allowed_sas_path_prefix = "/api/sas/v1/token/"
allowed_asset_path_prefix = "/sentinel2-l2/"
gdal_range_transport = "bounded_python_file_opener_with_counted_exact_http_range_responses"
working_directory = "data/interim/multicity/missing_support_calibration_evidence_v1/sentinel_smoke"

[outputs]
raw_stage_directory = "data/raw/multicity/missing_support_calibration_evidence_v1"
processed_stage_directory = "data/processed/multicity/missing_support_calibration_evidence_v1"
progress_path = "data/interim/multicity/missing_support_calibration_evidence_v1/status.json"
