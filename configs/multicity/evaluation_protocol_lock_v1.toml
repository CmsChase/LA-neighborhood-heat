[identity]
schema_version = 1
algorithm_version = "multicity-protocol-model-lock-v1"
experiment_id = "la_to_three_city_zero_shot_v1"
research_question = "Can a target-blind model trained on public weather, land-use, geography, and lagged satellite features predict neighborhood-scale daytime land-surface temperature on future dates and in unseen U.S. cities, with calibrated uncertainty?"

[cohorts]
training_city_id = "los_angeles_ca"
training_years = [2020, 2021, 2022, 2023]
training_rows = 73432
calibration_city_id = "los_angeles_ca"
calibration_year = 2024
calibration_rows = 25208
external_city_ids = ["phoenix_az", "houston_tx", "chicago_il"]
external_year = 2025
external_rows = 38301
external_city_dates = 64
los_angeles_2025_excluded_from_confirmation = true

[target]
name = "daytime_land_surface_temperature_c"
analysis_unit = "census_tract_by_target_date"
source = "Landsat Collection 2 Level-2 surface temperature"
minimum_valid_pixel_fraction = 0.60
minimum_valid_pixels_per_tract = 20
minimum_tract_footprint_fraction = 0.90
minimum_cloud_distance_km = 1.0

[models]
contract_source = "portable_predictor_contract"
training_row_weights = "each_training_date_total_weight_one_then_normalize"
dynamic_imputation = "per_feature_median_fit_on_los_angeles_2020_2023_only"
external_fit_or_recalibration_allowed = false

[uncertainty]
method = "equal_date_weighted_conformalized_quantile_regression"
lower_quantile = 0.05
upper_quantile = 0.95
nominal_coverage = 0.90
calibration_city_id = "los_angeles_ca"
calibration_year = 2024
abstention_width_quantile = 0.80
abstain_rule = "corrected_interval_width_strictly_greater_than_frozen_80th_percentile"

[evaluation]
primary_metric = "one_minus_external_equal_city_equal_date_mae_m2_divided_by_b1"
minimum_relative_mae_improvement = 0.10
require_ci_lower_above_zero = true
require_no_external_city_point_degradation = true
minimum_total_city_dates = 30
minimum_dates_per_external_city = 8
bootstrap_iterations = 10000
bootstrap_method = "city_stratified_crossed_complete_date_x_5km_spatial_block"
bootstrap_seed = 20260728
confidence_level = 0.95
overall_coverage_lower = 0.85
overall_coverage_upper = 0.95
per_city_coverage_lower = 0.80
minimum_retention = 0.60
accepted_mae_improvement = 0.10
hotspot_fraction = 0.20
hotspot_tie_break = "score_desc_tract_geoid_asc"
secondary_metrics = ["per_city_equal_date_mae", "rmse", "signed_error", "anomaly_mae", "per_date_spearman", "top20_hotspot_metrics", "coverage", "interval_width", "wis", "risk_coverage"]

[outputs]
prediction_columns = ["city_id", "tract_geoid", "target_date", "b1_prediction_c", "m2_prediction_c", "m2_lower_c", "m2_upper_c", "m2_interval_width_c", "m2_abstain", "m2_accepted"]
planned_figure_ids = ["external_city_mae", "predicted_vs_observed", "error_by_city_date", "interval_calibration", "risk_coverage", "spatial_error_maps"]
all_reports_require_row_date_block_counts = true

[permissions]
source_target_build_authorized = false
external_target_build_authorized = false
model_fit_authorized = false
model_score_authorized = false
external_targets_unlocked = false
external_target_values_read = false
external_prediction_commit_exists = false

