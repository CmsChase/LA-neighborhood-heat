schema_version = 1
algorithm_version = "initial-model-result-analysis-v1"
state = "frozen_development_result_analysis"

[paths]
evaluation_directory = "data/processed/model_evaluation"
output_directory = "reports/tables/model_results_initial"

[analysis]
final_test_year = 2025
final_test_locked = true
target_family = "joint"
target_model_id = "M2"
legal_baseline_model_ids = ["B0", "B1", "B2"]
primary_metric_column = "primary_equal_date_weighted_mae_c"
spearman_metric_column = "median_per_date_spearman"
expected_independent_date_count = 65
expected_independent_spatial_block_count = 71
expected_tract_date_row_count = 63403

[bootstrap]
method = "crossed_date_spatial_block"
sampling_unit = "complete_clusters_only"
seed = 20260722
replicates = 5000
confidence_level = 0.95

[success_gates]
minimum_relative_mae_improvement_fraction = 0.10
minimum_median_per_date_spearman = 0.50
uncertainty_relative_ci_lower_must_exceed = 0.0
