schema_version = 1
algorithm_version = "residual-spatial-diagnostics-v1"
state = "frozen_development_oof_diagnostics"

[paths]
result_analysis_config = "configs/result_analysis.toml"
evaluation_directory = "data/processed/model_evaluation"
target_manifest = "data/interim/targets/development_targets_model_ready.parquet"
tract_manifest = "data/interim/targets/primary_tract_manifest.parquet"
split_provenance = "manifests/validation_splits/split_provenance.json"
split_promotion = "manifests/validation_splits/split_promotion.json"
table_output_directory = "reports/tables/residual_spatial"
figure_output_directory = "reports/figures/generated/residual_spatial"

[analysis]
family = "joint"
target_model_id = "M2"
baseline_model_id = "B1"
residual_definition = "y_pred_minus_y_true"
final_test_year = 2025
final_test_locked = true
development_years = [2020, 2021, 2022, 2023, 2024]
expected_tract_date_rows_per_model = 63403
expected_independent_dates = 65
expected_spatial_blocks = 71
expected_tracts = 1096
expected_date_block_cells_per_model = 4202

[spatial]
analysis_crs = "EPSG:3310"
block_size_km = 5.0
block_id_pattern = "^x([+-]\\d{4})_y([+-]\\d{4})$"
adjacency = "rook_on_parsed_fixed_grid"
weights = "binary_symmetric"
date_block_aggregation = "unweighted_mean_residual_across_tracts"
permutation_seed = 20260722
permutations = 999
permutation_p_value = "two_sided_centered_on_randomization_expectation"
exploratory_alpha = 0.05

