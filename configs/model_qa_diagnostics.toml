schema_version = 1
algorithm_version = "model-qa-diagnostics-v1"
state = "frozen_development_diagnostics"

[paths]
result_analysis_config = "configs/result_analysis.toml"
target_build_progress = "data/interim/targets/build_progress.json"
model_ready_targets = "data/interim/targets/development_targets_model_ready.parquet"
date_summary = "data/interim/targets/date_summary.parquet"
model_dataset_provenance = "data/processed/model_dataset/model_dataset_provenance.json"
model_table = "data/processed/model_dataset/development_model_table.parquet"
target_inventory_summary = "manifests/target_inventory/inventory_summary.json"
scene_inventory = "manifests/target_inventory/scene_inventory.csv"
output_directory = "reports/tables/model_qa_diagnostics"

[analysis]
final_test_year = 2025
final_test_locked = true
family = "joint"
baseline_model_id = "B1"
target_model_id = "M2"
expected_tract_date_row_count = 63403
expected_independent_date_count = 65
expected_independent_spatial_block_count = 71
st_uncertainty_threshold_k = 2.0
low_scene_cloud_threshold_percent = 15.0
valid_fraction_breaks = [0.60, 0.70, 0.80, 0.90, 1.0000001]
cloud_distance_breaks_km = [1.0, 2.0, 5.0, 1000000.0]
failure_case_limit = 25
sentinel_feature_names = [
  "sentinel_ndvi_lag60",
  "sentinel_evi_lag60",
  "sentinel_ndwi_lag60",
  "sentinel_ndbi_lag60",
  "sentinel_albedo_proxy_lag60",
]

[bootstrap]
method = "crossed_date_spatial_block"
sampling_unit = "complete_clusters_only"
seed = 20260723
replicates = 5000
confidence_level = 0.95
