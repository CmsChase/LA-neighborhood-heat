[analysis]
final_test_year = 2025
expected_key_count = 25208
expected_tract_count = 1096
expected_inventory_overpass_count = 23
expected_inventory_scene_count = 45
expected_model_feature_count = 46
model_ids = ["B1", "M2"]
baseline_model_id = "B1"
primary_model_id = "M2"
primary_metric = "equal_date_weighted_mae_c"
evaluation_cohort = "all_date_usable_and_target_available_rows"
minimum_usable_date_count_for_metrics = 1
prediction_origin = "00:00 local time on target date"
interpretation = "historical_hindcast_surface_heat_hazard_proxy"

[bootstrap]
method = "crossed_date_spatial_block"
sampling_unit = "complete_clusters_only"
seed = 20260722
replicates = 5000
confidence_level = 0.95

[success_gates]
minimum_relative_mae_improvement_fraction = 0.10
minimum_median_per_date_spearman = 0.50
uncertainty_relative_ci_lower_must_exceed = 0.0

[hotspot]
gate_column = "relative_endpoint_coverage_pass"
label_column = "relative_hotspot_top20"
positive_fraction = 0.20
rank_order = "score_desc_geoid_asc"
exact_top_k = true
average_precision_input = "continuous_y_pred"

[publication]
protocol = "append_only_claim_then_atomic_directory_promotion"
allow_same_claim_resume = true
allow_second_claim = false
print_target_values_or_metrics_before_complete = false
exact_output_files = [
  "blind_predictions.parquet",
  "final_target_qa.parquet",
  "date_summary.parquet",
  "scene_contributions.parquet",
  "evaluation_rows.parquet",
  "model_metrics.csv",
  "per_date_metrics.csv",
  "paired_date_block_errors.csv",
  "crossed_bootstrap.json",
  "protocol_gates.csv",
  "hotspot_per_date.csv",
  "hotspot_summary.csv",
  "sensor_per_date_metrics.csv",
  "sensor_summary.csv",
  "sentinel_stratum_summary.csv",
  "qa_missingness_summary.csv",
  "tract_choropleth_summary.csv",
  "observed_predicted_residual_maps.pdf",
  "per_date_error_and_rank.png",
  "hotspot_precision_recall.png",
  "EVALUATION_COMMIT.json",
]
