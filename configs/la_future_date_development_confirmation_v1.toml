  { daily_gain_sd_c = 0.15, adjacent_date_correlation = 0.15, dates = 106 },
  { daily_gain_sd_c = 0.15, adjacent_date_correlation = 0.30, dates = 145 },
  { daily_gain_sd_c = 0.20, adjacent_date_correlation = 0.00, dates = 139 },
  { daily_gain_sd_c = 0.20, adjacent_date_correlation = 0.15, dates = 188 },
  { daily_gain_sd_c = 0.20, adjacent_date_correlation = 0.30, dates = 257 },
]

[feasibility]
historical_physical_dates_per_warm_season = 18.0
historical_qa_usable_fraction = 0.7222222222222222
historical_usable_dates_per_warm_season = 13.0
recent_2022_2024_usable_dates_per_warm_season = 16.333333333333332
development_30_date_estimated_warm_seasons = [1.84, 2.31]
central_confirmation_106_date_estimated_warm_seasons = [6.49, 8.15]
combined_136_date_estimated_warm_seasons = [8.33, 10.46]
