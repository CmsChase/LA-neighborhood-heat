[protocol]
id = "la-future-date-development-confirmation-v1"
state = "complete_draft_collection_not_authorized"
city_id = "los_angeles_ca"
primary_claim = "historical reconstruction of within-LA neighborhood relative land-surface temperature"
secondary_claim = "absolute land-surface temperature"
operational_realtime_claim_allowed = false
realtime_claim_unlock = "Every dynamic input must have evidence that its exact version was published before the prediction origin."
new_data_download_authorized = false
model_training_authorized = false
target_read_authorized = false

[historical_roles]
training_and_development_start_year = 2020
training_and_development_end_year = 2024
usable_historical_dates = 65
training_dates_2020_2021 = 16
reused_development_dates_2022_2024 = 49
unused_qa_eligible_dates_2020_2024 = 0
la_2025_remains_frozen = true
historical_dates_may_not_be_relabelled_as_independent_confirmation = true

[acquisition_frame]
warm_season_months = [5, 6, 7, 8, 9, 10]
include_every_physical_overpass_meeting_pre_target_sensor_geography_and_time_rules = true
physical_overpass_is_indivisible_between_batches = true
retain_failed_qa_dates_and_reasons = true
qa_rule_may_not_change_to_reach_sample_size = true
performance_dependent_stopping_forbidden = true
stop_only_at_end_of_warm_season_checkpoint = true

[development_batch]
role = "candidate_development_not_confirmation"
assignment = "First arriving eligible physical overpasses after a separately authorized start date."
minimum_usable_dates = 30
minimum_usable_dates_per_warm_season_month = 3
minimum_usable_dates_per_platform_when_both_landsat_8_and_9_operate = 8
extend_by_complete_warm_seasons_if_qa_count_or_coverage_gate_is_not_met = true
may_open_targets_after_default_predictions_and_batch_inventory_are_committed = true
may_diagnose_and_select_one_bounded_candidate = true
may_prove_upgrade = false

[confirmation_batch]
role = "one_time_independent_confirmation"
assignment = "All eligible physical overpasses after the development batch closes and the final candidate, default comparator, preprocessing, predictions, and analysis protocol are frozen."
minimum_usable_dates_planning_target = 106
minimum_usable_dates_absolute_floor = 30
minimum_usable_dates_per_warm_season_month = 3
minimum_usable_dates_per_platform_when_both_landsat_8_and_9_operate = 8
target_values_and_target_qa_sealed_until_prediction_commit = true
one_primary_evaluation_only = true
candidate_selection_or_refit_after_target_open_forbidden = true
confirmation_dates_may_not_be_reused_to_prove_a_revised_candidate = true

[target_and_predictor_retention]
complete_fixed_prediction_tract_universe_required = true
fixed_eligible_land_mask_and_identity_required = true
per_scene_pixel_temperature_required = true
per_scene_valid_and_quality_masks_required = true
scene_and_overpass_lineage_required = true
observation_geometry_if_available_required = true
all_eligible_and_failed_date_inventory_required = true
predictor_source_item_and_version_required = true
predictor_retrieval_timestamp_required = true
predictor_publication_timestamp_if_available_required = true
missing_publication_timestamp_claim = "historical reconstruction only"

[qa_and_scoring]
qa_candidate = "4k"
minimum_valid_pixel_fraction = 0.60
minimum_valid_pixels_per_tract = 20
minimum_tract_footprint_fraction = 0.90
minimum_date_tract_retention_fraction = 0.50
eligible_land_denominator_must_remain_fixed = true
primary_metric = "mean across dates of within-date tract MAE for relative LST"
primary_independent_unit = "physical overpass date"
spatial_dependence_unit = "fixed 5 km spatial block"
tract_date_rows_are_not_independent_samples = true
relative_center = "median over the complete fixed prediction tract universe before joining QA-scored rows"
absolute_temperature_metric_is_secondary = true
hotspot_top20_and_complete_support_centering_are_secondary = true

[upgrade_decision]
comparator = "existing default 23-feature relative model"
minimum_relative_mae_improvement_fraction = 0.05
paired_date_by_spatial_block_interval_lower_bound_must_exceed_celsius = 0.0
one_time_primary_decision = true
new_candidate_requires_prediction_time_legal_evidence_from_development_batch = true
spatial_correction_or_tmax_transformation_precommitted = false
broad_model_search_allowed = false

[sample_size_evidence]
historical_default_date_macro_mae_c = 0.9530809315964125
five_percent_effect_c = 0.04765404657982063
historical_dates = 49
historical_spatial_blocks = 71
within_date_six_neighbor_residual_spearman_median = 0.890
observed_paired_daily_gain_sd_spatial_candidate_c = 0.013845720534917583
observed_paired_daily_gain_sd_local_selected_c = 0.13510854361819322
observed_paired_daily_gain_sd_tmax_candidate_c = 0.17097655766512423
planning_daily_gain_sd_c = 0.15
planning_adjacent_date_correlation = 0.15
alpha_two_sided = 0.05
power = 0.80
planning_required_confirmation_dates = 106
uncertainty = "The variance and serial-correlation estimates use only 49 repeatedly used development dates and depend on the as-yet-unknown candidate."

sample_size_scenarios = [
  { daily_gain_sd_c = 0.10, adjacent_date_correlation = 0.00, dates = 35 },
  { daily_gain_sd_c = 0.10, adjacent_date_correlation = 0.15, dates = 47 },
